workflows:
  ios-testflight:
    name: GSD MCH - iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    # "GSD_MCH_ASC_KEY" must match the name you gave the App Store Connect
    # API key when you connected it under Codemagic Team settings >
    # Integrations > Developer Portal. Codemagic uses that stored key to
    # AUTOMATICALLY fetch/create the certificate and provisioning profile
    # before any of the scripts below even run - that's what the
    # `ios_signing` block underneath triggers. Do NOT also add manual
    # `app-store-connect fetch-signing-files` / `keychain` / `use-profiles`
    # scripts - mixing the two signing methods is what caused the
    # "No matching profiles found" error.
    integrations:
      app_store_connect: GSD_MCH_ASC_KEY

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.getstuffdone.gsdmch
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Sync web app into the iOS project
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install

      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build .ipa for App Store distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - keironb@gmail.com
        notify:
          success: true
          failure: true
