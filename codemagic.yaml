workflows:
  ios-testflight:
    name: GSD MCH - iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    # "GSD_MCH_ASC_KEY" matches the App Store Connect API key name
    # connected under Codemagic Team settings > Integrations > Developer
    # Portal. That key has App Manager access, so the "Fetch signing
    # files" script below can create a brand-new distribution certificate
    # and provisioning profile from scratch, entirely on Codemagic's own
    # Mac build machine - no local Mac needed, and no certs need to
    # already exist anywhere.
    #
    # NOTE: deliberately no `ios_signing:` block in `environment` below.
    # That block tells Codemagic to look for an ALREADY-STORED profile
    # under Settings > Code Signing Identities rather than create one -
    # since this app has never had a certificate/profile before, that
    # lookup always fails with "No matching profiles found". The scripted
    # approach below is what actually creates them.
    integrations:
      app_store_connect: GSD_MCH_ASC_KEY

    environment:
      vars:
        BUNDLE_ID: "com.getstuffdone.gsdmch"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Sync web app into the iOS project
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install

      - name: Set up keychain for code signing
        script: keychain initialize

      - name: Fetch (or create) signing files from App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply code signing settings to the Xcode project
        script: xcode-project use-profiles

      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build .ipa for App Store distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - keironb@gmail.com
        notify:
          success: true
          failure: true
