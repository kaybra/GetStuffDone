workflows:
  ios-testflight:
    name: GSD MCH - iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    # "GSD_MCH_ASC_KEY" matches the App Store Connect API key name
    # connected under Codemagic Team settings > Integrations > Developer
    # Portal.
    integrations:
      app_store_connect: GSD_MCH_ASC_KEY

    environment:
      # "ios_signing" is the environment variable group (created in the
      # app's Environment variables tab) that holds CERTIFICATE_PRIVATE_KEY -
      # a 2048-bit RSA private key the "Fetch (or create) signing files"
      # script needs to generate a brand-new distribution certificate from
      # scratch. Without this, certificate creation fails with "Cannot
      # save Signing Certificates without certificate private key".
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.getstuffdone.gsdmch"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Sync web app into the iOS project
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install

      - name: Set up keychain for code signing
        script: keychain initialize

      - name: Fetch (or create) signing files from App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply code signing settings to the Xcode project
        script: xcode-project use-profiles

      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build .ipa for App Store distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - keironb@gmail.com
        notify:
          success: true
          failure: true

  android-play-bundle:
    name: GSD MCH - Android (Play .aab)
    max_build_duration: 30
    instance_type: linux_x2

    # Started by hand from the Codemagic dashboard (Start new build > pick this
    # workflow), so it doesn't spend minutes on every push the way the iOS one
    # does. To build on every push to main instead, add the same `triggering:`
    # block the iOS workflow uses.

    environment:
      # "gsd_mch_upload_keystore" is the reference name you give the upload
      # keystore under Codemagic Team settings > Code signing identities >
      # Android keystores. Codemagic then provides CM_KEYSTORE_PATH,
      # CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS and CM_KEY_PASSWORD, which
      # android/app/build.gradle reads to sign the release bundle.
      android_signing:
        - gsd_mch_upload_keystore
      vars:
        PACKAGE_NAME: "com.getstuffdone.gsdmch"
      node: 20
      java: 17

    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Sync web app into the Android project
        script: npx cap sync android

      - name: Build signed release bundle (.aab)
        script: |
          cd android
          chmod +x ./gradlew
          # BUILD_NUMBER becomes the Play versionCode; the version name is
          # package.json's "version", the same number iOS uses.
          ./gradlew bundleRelease -PversionCode="$BUILD_NUMBER"

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

    publishing:
      email:
        recipients:
          - keironb@gmail.com
        notify:
          success: true
          failure: true
      # Turn this on once the first release has been uploaded by hand in Play
      # Console and a Google service account exists (create a "google_play"
      # variable group holding GCLOUD_SERVICE_ACCOUNT_CREDENTIALS, then add
      # `groups: [google_play]` under environment above).
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true
